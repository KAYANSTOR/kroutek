name: Build Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Use system gradle to rebuild wrapper
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Kurotek APK (كروتك)
      run: ./gradlew :kurotek:assembleDebug

    - name: Build Serial App APK (تطبيق السيريالات)
      run: ./gradlew :app:assembleDebug

    - name: Upload Kurotek APK
      uses: actions/upload-artifact@v4
      with:
        name: Kurotek-App-APK
        path: kurotek/build/outputs/apk/debug/kurotek-debug.apk

    - name: Upload Serial App APK
      uses: actions/upload-artifact@v4
      with:
        name: Serial-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
