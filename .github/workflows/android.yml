name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :kurotek:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kurotek-app
        path: kurotek/build/outputs/apk/debug/kurotek-debug.apk

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "Latest Debug Build"
        files: kurotek/build/outputs/apk/debug/kurotek-debug.apk
        prerelease: true
