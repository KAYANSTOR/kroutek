name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Regenerate Gradle Wrapper
      run: gradle wrapper
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Clean build cache
      run: ./gradlew clean
      
    - name: Build Kurotek Debug APK
      run: ./gradlew :kurotek:assembleDebug --rerun-tasks --no-build-cache
       
    - name: Build Serial App Debug APK
      run: ./gradlew :app:assembleDebug --rerun-tasks --no-build-cache
      
    - name: Zip Server Directory
      run: |
        # Zip the server folder so users can download and run it easily
        zip -r backend-server.zip server/ package.json tsconfig.json admin_panel.html -x "server/node_modules/*" "server/dist/*" "node_modules/*" "dist/*"
        
    - name: Upload Kurotek APK
      uses: actions/upload-artifact@v4
      with:
        name: kurotek-debug-apk
        path: kurotek/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Serial App APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "latest"
        name: "Latest Build (Apps & Server)"
        files: |
          kurotek/build/outputs/apk/debug/kurotek-debug.apk
          app/build/outputs/apk/debug/app-debug.apk
          backend-server.zip
        prerelease: true
