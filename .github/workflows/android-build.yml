name: Android CI

on:
  push:
    branches: [ "main", "session/**" ]
    paths:
      - 'kurotek/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'kurotek/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/libs.versions.toml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: '17'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      BUILD_REPORTS_DIR: ${{ github.workspace }}/kurotek/build/reports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-level: 35
          build-tools-level: 35.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Decode secrets from env if present
        env:
          ENCODED_ENV: ${{ secrets.ENCODED_ENV }}
        run: |
          if [ -n "$ENCODED_ENV" ]; then
            echo "$ENCODED_ENV" | base64 -d > .env
          fi

      - name: Run unit tests
        run: ./gradlew :kurotek:testDebugUnitTest --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew :kurotek:lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew :kurotek:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kurotek-debug-apk
          path: kurotek/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurotek-build-reports
          path: |
            ${{ env.BUILD_REPORTS_DIR }}/**/*
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurotek-lint-reports
          path: |
            kurotek/build/reports/lint-results*.html
            kurotek/build/reports/lint-results*.xml
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kurotek-test-reports
          path: |
            kurotek/build/reports/tests/**/*
          retention-days: 30

